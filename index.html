<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고슴도치</title>
<meta name="description" content="고슴도치의 자기소개 페이지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one narrow column; profile header with a round photo slot, a short fact list, then the contact form. */
  :root {
    --bg: #f5f9fc;
    --surface: #ffffff;
    --ink: #15222e;
    --muted: #5b6b7a;
    --line: #dbe5ee;
    --sky: #87ceeb;
    --accent: #1a6fae;
    --on-accent: #ffffff;
    --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c141c;
      --surface: #131f2a;
      --ink: #e7eff6;
      --muted: #9fb0bf;
      --line: #24384a;
      --sky: #87ceeb;
      --accent: #7cc4f0;
      --on-accent: #0c141c;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 1rem;
    line-height: 1.7;
    word-break: keep-all;
  }
  .wrap {
    max-width: 680px;
    margin-inline: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1, h2, p, dl, dd { margin: 0; }
  h1, h2 { text-wrap: balance; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Profile */
  .profile { padding-block: 64px 40px; display: flex; flex-wrap: wrap; align-items: center; gap: 28px; }
  .avatar {
    width: 132px;
    height: 132px;
    flex: none;
    border-radius: 50%;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: var(--surface);
    border: 4px solid var(--sky);
    color: var(--muted);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar svg { width: 56px; height: 56px; }
  .who { display: grid; gap: 6px; min-width: 0; }
  .label { font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.08em; color: var(--accent); }
  h1 { font-size: 2.5rem; line-height: 1.2; font-weight: 700; }
  .intro { color: var(--muted); font-size: 1.0625rem; }

  /* Facts */
  .facts { border-top: 1px solid var(--line); }
  .facts div {
    display: grid;
    grid-template-columns: 8rem minmax(0, 1fr);
    gap: 16px;
    padding-block: 16px;
    border-bottom: 1px solid var(--line);
  }
  .facts dt { color: var(--muted); font-weight: 500; }
  .facts dd { font-weight: 500; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .chip { padding: 2px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 0.9375rem; }
  .swatch { width: 18px; height: 18px; border-radius: 50%; background: var(--sky); border: 1px solid var(--line); }
  .hex { color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; }

  /* Contact */
  .contact { padding-block: 56px 24px; display: grid; gap: 20px; }
  h2 { font-size: 1.5rem; font-weight: 700; }
  .contact p.note { color: var(--muted); margin-top: 4px; }
  form {
    display: grid;
    gap: 16px;
    padding: 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field label { font-weight: 600; font-size: 0.9375rem; }
  .optional { color: var(--muted); font-weight: 400; }
  input, textarea {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 8rem; resize: vertical; }
  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  #count { color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
  button {
    font: inherit;
    font-weight: 600;
    color: var(--on-accent);
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    padding: 10px 22px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #status { min-height: 1.7em; font-size: 0.9375rem; color: var(--muted); }

  footer { padding-block: 32px 48px; color: var(--muted); font-size: 0.875rem; }

  @media (max-width: 560px) {
    .profile { padding-block: 40px 32px; }
    h1 { font-size: 2rem; }
    .facts div { grid-template-columns: minmax(0, 1fr); gap: 4px; }
    .two { grid-template-columns: minmax(0, 1fr); }
    form { padding: 18px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header class="profile">
    <!-- 프로필 사진: 사진 파일(예: profile.jpg)을 저장소에 올린 뒤 아래 svg를 <img src="profile.jpg" alt="고슴도치 프로필 사진">로 바꾸세요. -->
    <div class="avatar" role="img" aria-label="프로필 사진 자리">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <circle cx="12" cy="8.5" r="3.75"/>
        <path d="M4.5 20c1.3-3.6 4.2-5.5 7.5-5.5s6.2 1.9 7.5 5.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="who">
      <p class="label">ABOUT ME</p>
      <h1>고슴도치</h1>
      <p class="intro">멍때리기와 유튜브 보기를 좋아하는 고슴도치입니다.</p>
    </div>
  </header>

  <dl class="facts">
    <div><dt>직업</dt><dd>무직</dd></div>
    <div><dt>취미</dt><dd><span class="chip">멍때리기</span><span class="chip">유튜브 보기</span></dd></div>
    <div><dt>좋아하는 색</dt><dd><span class="swatch" aria-hidden="true"></span>하늘색 <span class="hex">#87CEEB</span></dd></div>
  </dl>

  <section class="contact" aria-labelledby="contact-title">
    <div>
      <h2 id="contact-title">연락하기</h2>
      <p class="note">남긴 메시지는 고슴도치만 볼 수 있습니다. 답장을 받고 싶다면 연락처를 함께 적어 주세요.</p>
    </div>
    <form id="form" novalidate>
      <div class="two">
        <div class="field">
          <label for="name">이름</label>
          <input id="name" name="name" maxlength="30" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="contact">연락처 <span class="optional">(선택)</span></label>
          <input id="contact" name="contact" maxlength="100" autocomplete="email" placeholder="이메일 등">
        </div>
      </div>
      <div class="field">
        <label for="message">메시지</label>
        <textarea id="message" name="message" maxlength="1000" required></textarea>
      </div>
      <div class="row">
        <span id="count">0 / 1000</span>
        <button id="submit" type="submit">보내기</button>
      </div>
      <p id="status" role="status"></p>
    </form>
  </section>

  <footer>© 고슴도치</footer>
</main>

<script>
  /* Contact form: Supabase REST API. The publishable key is meant for browsers; RLS allows sending only, not reading. */
  (function () {
    var API = "https://akuodabqwawrftxycdsu.supabase.co/rest/v1/contact_messages";
    var KEY = "sb_publishable_Wp_j9PzUw8dufsObR0SI4A_q_5YTnfg";
    var form = document.getElementById("form");
    var nameEl = document.getElementById("name");
    var contactEl = document.getElementById("contact");
    var messageEl = document.getElementById("message");
    var count = document.getElementById("count");
    var submit = document.getElementById("submit");
    var status = document.getElementById("status");

    messageEl.addEventListener("input", function () {
      count.textContent = messageEl.value.length + " / 1000";
    });

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      var payload = {
        name: nameEl.value.trim(),
        contact: contactEl.value.trim() || null,
        message: messageEl.value.trim()
      };
      if (!payload.name || !payload.message) {
        status.textContent = "이름과 메시지를 입력해 주세요.";
        (payload.name ? messageEl : nameEl).focus();
        return;
      }
      submit.disabled = true;
      status.textContent = "보내는 중입니다.";
      try {
        var res = await fetch(API, {
          method: "POST",
          headers: { apikey: KEY, "Content-Type": "application/json", Prefer: "return=minimal" },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          form.reset();
          count.textContent = "0 / 1000";
          status.textContent = "메시지를 보냈습니다. 고마워요!";
        } else {
          var body = await res.json().catch(function () { return null; });
          status.textContent = body && body.code === "PGRST205"
            ? "연락처 폼이 아직 준비되지 않았습니다. 잠시 후 다시 시도해 주세요."
            : "메시지를 보내지 못했습니다. 잠시 후 다시 시도해 주세요.";
        }
      } catch (err) {
        status.textContent = "서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.";
      }
      submit.disabled = false;
    });
  })();
</script>
</body>
</html>
